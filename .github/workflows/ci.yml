name: CI

# 构建前置：ionet-ts 框架源码由本 workflow 检出到 `vendor/ionet-ts/`。
# 本仓库**不提交**该目录（见 .gitignore），pnpm-workspace.yaml 通过
# `vendor/ionet-ts/packages/*` 把框架包纳入 workspace，因此构建前必须就位。
#
# 若 ionet-ts 是私有仓库，需配置 secret `IONET_TS_TOKEN`（对 matcha-cult/ionet-ts 有读权限的 PAT）。
# 未配置时回退到 github.token（仅当两仓库同属一个组织且允许默认 token 跨仓库读取时才有效）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest

    # 沙箱/本地开发机通常**没有** PostgreSQL 服务端二进制也没有 Docker daemon
    # （本仓库实测：只有 psql 客户端，无 initdb/postgres，无 /var/run/docker.sock）。
    # 因此所有**依赖真实数据库**的验收（db:init、角色存档读写、端到端联调）
    # 都放在 CI 的这个 service 上跑，本地只保证 build / typecheck / 纯逻辑单测。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idle_dark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/idle_dark
      JWT_SECRET: ci-secret-not-for-production
      IONET_ALLOW_PRODUCTION: 'true'
      PORT: '3000'

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出 ionet-ts 框架源码到 vendor/ionet-ts
        uses: actions/checkout@v4
        with:
          repository: matcha-cult/ionet-ts
          ref: dev
          path: vendor/ionet-ts
          token: ${{ secrets.IONET_TS_TOKEN || github.token }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 校验框架目录已就位
        run: |
          test -f vendor/ionet-ts/PROTOCOL.md || { echo "vendor/ionet-ts 未就位"; exit 1; }
          ls vendor/ionet-ts/packages

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建（顺序：protocol → game-core → 其余）
        run: pnpm run build

      - name: 类型校验
        run: pnpm run typecheck

      - name: 校验 Prisma schema（数据设计真相）
        run: pnpm --filter idle-dark-server run prisma:validate
        env:
          # validate 不连库，但 Prisma 读 schema 时会解析 datasource 的 env()
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 单元测试（不依赖数据库）
        run: pnpm run test

      - name: 初始化数据库表
        run: pnpm --filter idle-dark-server run db:init

      - name: 端到端冒烟（线协议）
        run: |
          node packages/server/dist/main.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          node packages/server/scripts/ws-protocol-smoke.mjs 3000 "$JWT_SECRET"
          # 路由探针：确认各域 Action 都已注册（未注册会 404）
          node packages/server/scripts/route-probe.mjs 3000 "$JWT_SECRET"
          kill %1

      - name: 端到端冒烟（完整游戏流程，需数据库）
        run: |
          node packages/server/dist/main.js > /tmp/server-game.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          node packages/server/scripts/game-flow-smoke.mjs 3000
          kill %1

      - name: 失败时输出服务端日志
        if: failure()
        run: |
          tail -200 /tmp/server.log || true
          tail -200 /tmp/server-game.log || true
